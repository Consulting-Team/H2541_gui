appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} {h({l:5.6})} {m}{n}"
    filters:
      - kind: threshold
        level: info
        # level: debug
  file:
    kind: file
    append: false
    encoder:
      # pattern: "{d(%Y-%m-%d %H:%M:%S)} {h({l:5.6})} {m} [{t}:{L}]{n}"
      pattern: "{d(%Y-%m-%d %H:%M:%S)} {h({l:5.6})} {m}{n}"
    path: "log/report_gen.log"
    filters:
      - kind: threshold
        level: info
  debug:
    kind: file
    append: false
    encoder:
      # pattern: "{d(%Y-%m-%d %H:%M:%S)} {h({l:5.6})} {m} [{t}:{L}]{n}"
      pattern: "{d(%Y-%m-%d %H:%M:%S)} {h({l:5.6})} {m}{n}"
    path: "log/debug.log"
    filters:
      - kind: threshold
        level: debug

root:
  # level: info
  # level: debug
  appenders:
    - stdout
    - file
    - debug